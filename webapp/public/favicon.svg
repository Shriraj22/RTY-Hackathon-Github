<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favRim" x1="4" y1="4" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="favLens" cx="26" cy="26" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#fecdd3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1" />
    </radialGradient>
  </defs>
  
  <rect width="64" height="64" rx="18" fill="#0f172a"/>
  
  <!-- Lens Glass -->
  <circle cx="26" cy="26" r="17" fill="url(#favLens)" />
  
  <!-- Outer Rim / Letter Q Ring -->
  <circle cx="26" cy="26" r="17" stroke="url(#favRim)" stroke-width="6.5" stroke-linecap="round" />
  
  <!-- Glass Reflection Arch -->
  <path d="M15 18 A 14 14 0 0 1 29 11" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  
  <!-- Reticle Dot -->
  <circle cx="26" cy="26" r="3.5" fill="#ef4444" />

  <!-- Magnifier Handle -->
  <line x1="39" y1="39" x2="54" y2="54" stroke="url(#favRim)" stroke-width="7.5" stroke-linecap="round" />
  <line x1="41" y1="41" x2="51" y2="51" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
</svg>
